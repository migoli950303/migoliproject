
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10051f">
<title>NEON RPS // 霓虹猜拳</title>

<style>
:root {
  --bg:#10051f; --panel:#1b1030; --cyan:#00f5ff;
  --pink:#ff38c7; --yellow:#faff00; --text:#f5f0ff;
  --muted:#a69abf;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Courier New",monospace;
  background:radial-gradient(ellipse at 50% 0%,#402060 0%,transparent 55%),
             linear-gradient(#10051f,#090414);
  overflow-x:hidden;
}
body::before {
  content:""; position:fixed; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#ffffff06 4px,transparent 5px);
  z-index:5;
}
button,input { font:inherit; }
button { touch-action:manipulation; }
button:focus-visible,input:focus-visible { outline:2px solid white; outline-offset:4px; }
header { text-align:center; padding:32px 14px 18px; }
.logo {
  font-size:clamp(27px,7vw,48px); font-weight:900; letter-spacing:3px;
  color:white; text-shadow:0 0 8px var(--cyan),0 0 24px var(--pink); margin:0;
}
.subtitle { color:var(--cyan); font-size:11px; letter-spacing:4px; margin-top:8px; }
main { width:min(100% - 24px,680px); margin:auto; padding-bottom:40px; }
.panel {
  background:#1b1030ef; border:1px solid #68418a;
  box-shadow:0 0 20px #a020ff19,inset 0 0 24px #a020ff0b;
  border-radius:14px; padding:20px; margin-bottom:15px;
}
h2 { font-size:15px; color:var(--cyan); letter-spacing:2px; margin:0 0 16px; }
p { line-height:1.7; }
.muted { color:var(--muted); font-size:12px; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:8px; }
input {
  width:100%; min-width:0; padding:15px; border:1px solid #624b7b;
  border-radius:8px; background:#0e071a; color:white; font-size:17px;
}
input::placeholder { color:#78698e; }
.field { margin-bottom:14px; }
.btn {
  border:1px solid var(--cyan); color:var(--cyan); background:#00f5ff0b;
  padding:14px 16px; border-radius:8px; cursor:pointer; font-weight:bold;
  transition:.15s; min-height:48px;
}
.btn:active { transform:scale(.97); }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn.primary { background:var(--cyan); color:#10051f; box-shadow:0 0 16px #00f5ff55; }
.btn.pink { border-color:var(--pink); color:var(--pink); }
.btn.yellow { border-color:var(--yellow); color:var(--yellow); }
.btn.full { width:100%; }
.btnrow { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.status {
  color:var(--yellow); font-size:12px; line-height:1.7; padding:10px 12px;
  border-radius:8px; background:#faff000c; border:1px solid #faff0035;
  overflow-wrap:anywhere;
}
.hidden { display:none!important; }
.room-code {
  font-size:clamp(34px,10vw,52px); color:var(--yellow); letter-spacing:9px;
  font-weight:bold; text-align:center; text-shadow:0 0 15px #faff0066; margin:10px 0;
}
.center { text-align:center; }
.players { display:grid; gap:8px; }
.player {
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:13px; border-radius:8px; background:#ffffff06; border:1px solid #ffffff14;
}
.player.me { border-color:#00f5ff77; }
.player-name { overflow-wrap:anywhere; }
.score { color:var(--yellow); white-space:nowrap; }
.tag { color:var(--cyan); font-size:10px; margin-left:5px; }
.choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0; }
.choice {
  min-width:0; min-height:112px; padding:12px 3px; background:#0e071a;
  color:white; border:1px solid #64427c; border-radius:12px; cursor:pointer;
}
.choice .emoji { display:block; font-size:clamp(35px,10vw,50px); margin-bottom:8px; }
.choice .word { font-size:12px; }
.choice.selected { border-color:var(--cyan); background:#00f5ff17; box-shadow:0 0 18px #00f5ff44; transform:translateY(-3px); }
.result { border:1px solid var(--pink); border-radius:10px; padding:16px; text-align:center; background:#ff38c70b; }
.result-title { font-size:23px; color:var(--pink); font-weight:bold; margin-bottom:10px; }
.result-line { padding:7px 0; border-bottom:1px solid #ffffff10; }
.result-line:last-child { border-bottom:0; }
footer { text-align:center; color:#78698e; font-size:10px; padding:10px; }
#toast { margin-top:12px; font-size:12px; color:var(--yellow); line-height:1.6; overflow-wrap:anywhere; }
@media(max-width:420px) {
  header { padding-top:24px; }
  .panel { padding:15px; }
  .btn { padding:12px 8px; font-size:12px; }
  .choice { min-height:104px; }
}
</style>
</head>

<body>
<header>
  <h1 class="logo">NEON RPS</h1>
  <div class="subtitle">ROCK · PAPER · SCISSORS</div>
</header>

<main>
  <div class="panel">
    <h2>// PLAYER SETUP</h2>
    <div class="field">
      <label for="nickname">你的玩家名稱</label>
      <input id="nickname" maxlength="12" placeholder="輸入暱稱" autocomplete="nickname">
    </div>
    <div id="connection" class="status">正在連接 Firebase...</div>
  </div>

  <section id="lobby">
    <div class="panel">
      <h2>// CREATE ROOM</h2>
      <p class="muted">建立專屬 4 位數房間，邀請朋友加入。每間房最多 3 位玩家。</p>
      <button id="createBtn" class="btn primary full" disabled>＋ 建立新房間</button>
    </div>
    <div class="panel">
      <h2>// JOIN ROOM</h2>
      <div class="field">
        <label for="roomInput">輸入朋友的 4 位數房號</label>
        <input id="roomInput" inputmode="numeric" maxlength="4" placeholder="例如：2580">
      </div>
      <button id="joinBtn" class="btn pink full" disabled>加入房間 →</button>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="panel center">
      <h2>// ROOM CODE</h2>
      <div id="roomCode" class="room-code">----</div>
      <div class="btnrow">
        <button id="copyBtn" class="btn yellow">複製房號</button>
        <button id="leaveBtn" class="btn pink">離開房間</button>
      </div>
      <p id="roomStatus" class="muted">等待玩家加入...</p>
    </div>

    <div class="panel">
      <h2>// PLAYERS <span id="playerCount">0/3</span></h2>
      <div id="playerList" class="players"></div>
    </div>

    <div class="panel">
      <h2>// YOUR MOVE</h2>
      <p id="roundText" class="muted">等待遊戲開始</p>
      <div class="choices">
        <button class="choice" data-choice="rock" aria-label="出石頭">
          <span class="emoji">✊</span><span class="word">石頭</span>
        </button>
        <button class="choice" data-choice="paper" aria-label="出布">
          <span class="emoji">✋</span><span class="word">布</span>
        </button>
        <button class="choice" data-choice="scissors" aria-label="出剪刀">
          <span class="emoji">✌️</span><span class="word">剪刀</span>
        </button>
      </div>
      <div id="choiceStatus" class="status">請先等待至少兩位玩家加入。</div>
    </div>

    <div id="resultPanel" class="panel hidden">
      <h2>// ROUND RESULT</h2>
      <div id="result" class="result"></div>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</main>

<footer>NEON RPS // POWERED BY FIREBASE REALTIME DATABASE</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import {
  getDatabase, ref, get, set, onValue, runTransaction, onDisconnect
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

/* Firebase 專案設定：已填入你提供的內容 */
const firebaseConfig = {
  apiKey: "AIzaSyAuEe6rhwqB6O29OBakqpd8WI5O1ZMRGBk",
  authDomain: "onlinetest-a4d03.firebaseapp.com",
  databaseURL: "https://onlinetest-a4d03-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onlinetest-a4d03",
  storageBucket: "onlinetest-a4d03.firebasestorage.app",
  messagingSenderId: "52400726009",
  appId: "1:52400726009:web:fac2f05d3dff12c94ca728"
};

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let uid = null;
let currentRoom = null;
let roomData = null;
let roomListener = null;
let selectedChoice = null;
let busy = false;
let lastRenderedRound = null;

const names = {
  rock: "✊ 石頭",
  paper: "✋ 布",
  scissors: "✌️ 剪刀"
};

function toast(message) {
  $("toast").textContent = message || "";
}
function setConnection(message) {
  $("connection").textContent = message;
}
function nickname() {
  return $("nickname").value.trim().slice(0, 12) || "玩家";
}
function playerCount(room) {
  return Object.keys(room?.players || {}).length;
}
function roomRef(code) {
  return ref(db, "rooms/" + code);
}
function playerRef(code) {
  return ref(db, `rooms/${code}/players/${uid}`);
}
function randomCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}
function emptyResult() {
  // 使用物件而不是 null，確保 lastResult 節點存在。
  return { round: 0, moves: {}, winners: [], message: "", at: 0 };
}

onAuthStateChanged(auth, user => {
  if (user) {
    uid = user.uid;
    setConnection("已連線 Firebase ✓");
    $("createBtn").disabled = false;
    $("joinBtn").disabled = false;
  } else {
    setConnection("正在登入...");
  }
});

signInAnonymously(auth).catch(error => {
  setConnection("匿名登入失敗：" + error.message);
  toast("請到 Firebase Console → Authentication → Sign-in method，啟用 Anonymous。");
});

$("createBtn").addEventListener("click", createRoom);
$("joinBtn").addEventListener("click", joinRoom);
$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(currentRoom);
    toast("房號已複製：" + currentRoom);
  } catch {
    toast("請手動記下房號：" + currentRoom);
  }
});
$("leaveBtn").addEventListener("click", leaveRoom);
$("roomInput").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4);
});
document.querySelectorAll(".choice").forEach(button => {
  button.addEventListener("click", () => choose(button.dataset.choice));
});

async function createRoom() {
  if (!uid || busy) return;
  busy = true;
  $("createBtn").disabled = true;
  toast("正在建立房間...");

  try {
    let code, created = false;

    for (let i = 0; i < 30; i++) {
      code = randomCode();
      const result = await runTransaction(roomRef(code), old => {
        if (old !== null) return;
        return {
          host: uid,
          createdAt: Date.now(),
          round: 1,
          players: {
            [uid]: { name: nickname(), score: 0, joinedAt: Date.now() }
          },
          choices: {},
          lastResult: emptyResult()
        };
      }, { applyLocally: false });

      if (result.committed) {
        created = true;
        break;
      }
    }

    if (!created) throw new Error("暫時無法產生房號，請再試一次。");
    await enterRoom(code);
  } catch (error) {
    toast("建立失敗：" + error.message);
  } finally {
    busy = false;
    $("createBtn").disabled = !uid;
  }
}

async function joinRoom() {
  if (!uid || busy) return;
  const code = $("roomInput").value.trim();

  if (!/^\d{4}$/.test(code)) {
    toast("請輸入完整的 4 位數房號。");
    return;
  }

  busy = true;
  $("joinBtn").disabled = true;

  try {
    const result = await runTransaction(roomRef(code), room => {
      if (!room || !room.players) return;

      if (room.players[uid]) {
        room.players[uid].name = nickname();
        return room;
      }

      if (Object.keys(room.players).length >= 3) return;

      room.players[uid] = {
        name: nickname(), score: 0, joinedAt: Date.now()
      };
      return room;
    }, { applyLocally: false });

    if (!result.committed) {
      const snapshot = await get(roomRef(code));
      if (!snapshot.exists()) throw new Error("找不到此房間。");
      throw new Error("房間已滿，最多只能有 3 人。");
    }

    await enterRoom(code);
  } catch (error) {
    toast("加入失敗：" + error.message);
  } finally {
    busy = false;
    $("joinBtn").disabled = !uid;
  }
}

async function enterRoom(code) {
  if (roomListener) roomListener();

  currentRoom = code;
  selectedChoice = null;
  lastRenderedRound = null;
  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("roomCode").textContent = code;
  toast("");

  try {
    await onDisconnect(playerRef(code)).remove();
  } catch (error) {
    toast("斷線清理設定失敗：" + error.message);
  }

  roomListener = onValue(roomRef(code), snapshot => {
    if (!snapshot.exists()) {
      toast("房間已不存在。");
      resetToLobby(false);
      return;
    }

    roomData = snapshot.val();

    if (!roomData.players || !roomData.players[uid]) {
      toast("你已離開房間。");
      resetToLobby(false);
      return;
    }

    renderRoom();
  }, error => {
    toast("讀取房間失敗：" + error.message);
  });
}

function renderRoom() {
  const room = roomData;
  const players = room.players || {};
  const ids = Object.keys(players);
  const count = ids.length;
  const choices = room.choices || {};
  const round = room.round || 1;

  $("playerCount").textContent = `${count}/3`;
  $("roomStatus").textContent =
    count < 2 ? "等待其他玩家加入..." :
    count < 3 ? "房間已可開始！也可以再加入一位玩家。" :
    "房間已滿，對戰開始！";

  $("playerList").innerHTML = ids.map(id => `
    <div class="player ${id === uid ? "me" : ""}">
      <span class="player-name">${escapeHTML(players[id].name || "玩家")}
        ${id === uid ? '<span class="tag">YOU</span>' : ""}
        ${id === room.host ? '<span class="tag">HOST</span>' : ""}
      </span>
      <span class="score">${Number(players[id].score || 0)} 勝</span>
    </div>
  `).join("");

  if (lastRenderedRound !== round) {
    selectedChoice = null;
    lastRenderedRound = round;
  }

  document.querySelectorAll(".choice").forEach(button => {
    button.classList.toggle("selected", button.dataset.choice === selectedChoice);
    button.disabled = count < 2 || !!choices[uid];
  });

  $("roundText").textContent = `ROUND ${round} // 共 ${count} 位玩家`;

  if (count < 2) {
    $("choiceStatus").textContent = "至少需要 2 位玩家才能開始。";
  } else if (choices[uid]) {
    $("choiceStatus").textContent = "你已出拳！等待其他玩家...";
  } else {
    $("choiceStatus").textContent = "選擇你的出拳，所有人出拳後公布結果！";
  }

  const result = room.lastResult;
  if (result && result.round > 0) {
    $("resultPanel").classList.remove("hidden");
    $("result").innerHTML = `
      <div class="result-title">第 ${result.round} 回合</div>
      ${ids.map(id => {
        const move = result.moves?.[id];
        const won = (result.winners || []).includes(id);
        return `<div class="result-line">
          ${escapeHTML(players[id]?.name || "玩家")}：
          ${names[move] || "未出拳"}${won ? " 🏆 勝利" : ""}
        </div>`;
      }).join("")}
      <p>${escapeHTML(result.message || "")}</p>
    `;
  } else {
    $("resultPanel").classList.add("hidden");
  }
}

async function choose(choice) {
  if (!currentRoom || !roomData || busy || !roomData.players?.[uid]) return;

  if (playerCount(roomData) < 2) {
    toast("等待至少一位其他玩家加入。");
    return;
  }

  if (roomData.choices?.[uid]) {
    toast("本回合你已經出拳，請等待結果。");
    return;
  }

  selectedChoice = choice;
  busy = true;
  renderRoom();

  try {
    const code = currentRoom;
    const roundToPlay = roomData.round;
    const moveRef = ref(db, `rooms/${code}/choices/${uid}`);

    const result = await runTransaction(moveRef, existing => {
      if (existing !== null) return;
      return { move: choice, round: roundToPlay };
    }, { applyLocally: false });

    if (!result.committed) {
      toast("你本回合已經出拳。");
      return;
    }

    await resolveRound(code, roundToPlay);
  } catch (error) {
    toast("出拳失敗：" + error.message);
  } finally {
    busy = false;
  }
}

async function resolveRound(code, roundNumber) {
  await runTransaction(roomRef(code), room => {
    if (!room || room.round !== roundNumber) return;

    const players = room.players || {};
    const ids = Object.keys(players);
    const choices = room.choices || {};

    if (ids.length < 2 || !ids.every(id =>
      choices[id] && choices[id].round === roundNumber
    )) return;

    const moves = {};
    ids.forEach(id => { moves[id] = choices[id].move; });

    const uniqueMoves = [...new Set(Object.values(moves))];
    let winners = [];
    let message = "";

    if (uniqueMoves.length === 1 || uniqueMoves.length === 3) {
      message = uniqueMoves.length === 1
        ? "全部出一樣！平手！"
        : "三種拳都出現了！本回合平手！";
    } else {
      const beats = {
        rock: "scissors",
        scissors: "paper",
        paper: "rock"
      };

      const winningMoves = uniqueMoves.filter(move =>
        uniqueMoves.every(other => move === other || beats[move] === other)
      );

      winners = ids.filter(id => winningMoves.includes(moves[id]));

      if (winners.length === 0) {
        message = "本回合平手！";
      } else {
        winners.forEach(id => {
          players[id].score = Number(players[id].score || 0) + 1;
        });
        message = winners.length === 1
          ? `${players[winners[0]].name} 贏得本回合！`
          : "多人獲勝！";
      }
    }

    room.lastResult = {
      round: roundNumber,
      moves,
      winners,
      message,
      at: Date.now()
    };

    room.choices = {};
    room.round = roundNumber + 1;
    return room;
  }, { applyLocally: false });
}

async function leaveRoom() {
  if (!currentRoom || busy) return;

  busy = true;
  try {
    const code = currentRoom;

    if (roomListener) {
      roomListener();
      roomListener = null;
    }

    const snapshot = await get(roomRef(code));

    if (snapshot.exists()) {
      const room = snapshot.val();

      if (room.players?.[uid]) {
        delete room.players[uid];
        if (room.choices) delete room.choices[uid];

        const remaining = Object.keys(room.players || {});

        if (remaining.length === 0) {
          await set(roomRef(code), null);
        } else {
          if (room.host === uid) room.host = remaining[0];

          // 離開時重置本回合，避免其他玩家卡在等待畫面。
          room.choices = {};
          room.round = (room.round || 1) + 1;
          room.lastResult = room.lastResult || emptyResult();

          await set(roomRef(code), room);
        }
      }
    }

    resetToLobby(true);
  } catch (error) {
    toast("離開房間失敗：" + error.message);
    resetToLobby(true);
  } finally {
    busy = false;
  }
}

function resetToLobby(showMessage) {
  if (roomListener) roomListener();
  roomListener = null;
  currentRoom = null;
  roomData = null;
  selectedChoice = null;
  lastRenderedRound = null;
  $("game").classList.add("hidden");
  $("lobby").classList.remove("hidden");

  if (showMessage) toast("已離開房間。");
}

window.addEventListener("beforeunload", () => {
  if (roomListener) roomListener();
});
</script>
</body>
</html>
